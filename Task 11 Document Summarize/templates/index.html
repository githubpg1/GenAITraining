<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Document Summary AI</title><link rel="stylesheet" href="/static/style.css"></head><body><main class="shell"><section class="hero"><span class="eyebrow">DOCUMENT WORKSPACE</span><h1>Document<br><span>Summary AI</span></h1><p>Upload a Word or PDF document and get a clear summary in seconds.</p></section><section class="card"><div class="card-title"><span class="step">01</span><h2>Upload document</h2></div><form id="upload-form"><label class="drop-zone" id="drop-zone" for="document"><input id="document" name="file" type="file" accept=".pdf,.docx,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document"><strong id="file-label">Choose a PDF or Word document</strong><span>or drag and drop it here · maximum 10 MB</span></label><p id="file-error" class="error" role="alert"></p><button id="submit-button" type="submit">Generate summary <span>→</span></button></form></section><section id="result" class="card result" hidden><div class="card-title"><span class="step">02</span><h2>Document summary</h2></div><p id="summary"></p><div class="actions"><button id="copy-button" type="button">Copy summary</button><span id="copy-status" role="status"></span></div></section></main><script src="/static/script.js"></script></body></html>
