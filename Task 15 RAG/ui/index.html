<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HR Policy Assistant</title><style>body{font-family:system-ui;max-width:850px;margin:40px auto;padding:0 20px;background:#f4f7fb;color:#172033}.card{background:white;padding:28px;border-radius:14px;box-shadow:0 5px 24px #182b4d18}textarea{width:100%;min-height:90px;margin:12px 0;padding:12px;box-sizing:border-box}button{background:#1d4ed8;color:white;border:0;padding:11px 20px;border-radius:8px;cursor:pointer}.answer{white-space:pre-wrap;margin-top:20px}.source{padding:10px;background:#eef4ff;margin:8px 0;border-radius:8px}small{color:#5c6b82}</style></head><body><div class="card"><h1>HR Policy Assistant</h1><p>Ask a question grounded in the available company policies.</p><textarea id="question" placeholder="How many vacation days do new hires receive?"></textarea><button onclick="ask()">Ask</button><div id="result"></div></div><script>async function ask(){const q=document.getElementById('question').value,result=document.getElementById('result');result.textContent='Searching policy documents...';try{const r=await fetch('/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q})});const d=await r.json();if(!r.ok)throw Error(d.detail||'Request failed');result.innerHTML=`<h2>Answer</h2><div class="answer">${escapeHtml(d.answer)}</div><p><b>Classification:</b> ${d.classification} &nbsp; <b>Confidence:</b> ${d.confidence}</p><h3>Sources</h3>${d.sources.map(s=>`<div class="source"><b>${escapeHtml(s.document)}</b><br>${escapeHtml(s.section)} · page ${s.page||'N/A'} · version ${s.version||'N/A'} · effective ${s.effective_date||'N/A'}</div>`).join('')}<details><summary>View supporting context</summary><pre>${escapeHtml(d.supporting_context.join('\n\n'))}</pre></details>`}catch(e){result.textContent=e.message}}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}</script></body></html>
