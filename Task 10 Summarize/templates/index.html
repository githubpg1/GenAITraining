<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Customer Email AI Assistant</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="shell">
    <section class="hero"><span class="eyebrow">SUPPORT WORKSPACE</span><h1>Customer Email<br><span>AI Assistant</span></h1><p>Turn customer emails into clear, thoughtful responses in seconds.</p></section>
    <form id="email-form" novalidate>
      <div class="card form-card"><div class="card-title"><span class="step">01</span><h2>Customer email</h2></div>
        <label for="from">From</label><input id="from" name="from" type="email" placeholder="customer@example.com" maxlength="254"><small class="field-error" data-error-for="from"></small>
        <label for="subject">Subject</label><input id="subject" name="subject" type="text" placeholder="Unable to access my account" maxlength="200"><small class="field-error" data-error-for="subject"></small>
        <label for="body">Email body</label><textarea id="body" name="body" rows="8" maxlength="10000" placeholder="I have been trying to log in to my account..."></textarea><small class="field-error" data-error-for="body"></small>
        <div class="form-footer"><span id="char-count">0 / 10,000</span><button id="submit-button" type="submit">Generate response <span>→</span></button></div>
        <p id="form-error" class="form-error" role="alert"></p>
      </div>
    </form>
    <section id="results" class="results" hidden><div class="card result-card"><div class="card-title"><span class="step">02</span><h2>Email summary</h2></div><p id="summary"></p></div>
      <div class="card result-card"><div class="card-title"><span class="step">03</span><h2>Suggested customer reply</h2></div><p id="reply"></p><div class="reply-actions"><button id="copy-button" type="button">Copy reply</button><span id="copy-status" role="status"></span></div></div>
    </section>
  </main>
  <script src="/static/script.js"></script>
</body>
</html>
